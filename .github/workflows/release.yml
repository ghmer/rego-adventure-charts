name: Release Helm chart

on:
  push:
    branches: [main]
    paths:
      - "charts/**"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: release-helm
  cancel-in-progress: false

env:
  CHART_DIR: charts/rego-adventure
  OCI_REPO: oci://ghcr.io/ghmer/charts
  HELM_VERSION: "v4.3.1"

jobs:
  release:
    name: Publish chart
    runs-on: ubuntu-latest
    steps:
      # fetch-depth 0 and persist-credentials are required: chart-releaser reads
      # previous releases and pushes index.yaml to the gh-pages branch.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "${GITHUB_ACTOR}@users.noreply.github.com"

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}

      # chart-releaser pushes the OCI artifact using the registry credential
      # store, so log in first.
      - name: Log in to the Container registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The chart is named explicitly instead of relying on chart-releaser's git
      # change detection, which finds nothing on a repository whose first release
      # is also its root commit. skip_existing keeps already published versions
      # untouched.
      - name: Publish chart (GitHub Release, index.yaml, OCI)
        uses: helm/chart-releaser-action@92c6b97fa9f664492a2592e0d1d80bc6bf378957 # v1.9.0
        with:
          charts: ${{ env.CHART_DIR }}
          skip_existing: true
          oci_registry_url: ${{ env.OCI_REPO }}
        env:
          CR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CR_GENERATE_RELEASE_NOTES: "true"
